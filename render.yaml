services:
  - type: web
    name: torontospends
    runtime: python
    plan: free
    rootDir: torontospends
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn torontospends.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: torontospends.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://torontospends.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.10"
